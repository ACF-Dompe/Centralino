server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Health endpoints — process-level only.
    # MUST NOT check the backend or the database (guidelines §10):
    # frontend readiness must not cascade an AGW backend-pool failure.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    location = /readyz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # API traffic is routed to the backend by the Application Gateway.
    # Anything reaching nginx under /api/ indicates an AGW routing problem.
    location /api/ {
        return 404;
    }

    # SPA fallback — client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}